<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Redirecting...</title>
  <script>
    // Clear any previously locked condition from the old code
    localStorage.removeItem("assigned_8cond_form");

    const urls = [

      "https://docs.google.com/forms/d/e/1FAIpQLSdTRyjvGAlOi8YmhBQeCSU-bkpAAL1DbKlOiE-ZbDZ3QgQMoA/viewform",
      "https://docs.google.com/forms/d/e/1FAIpQLSdzQmaskmjgVX6Mxl64gka-2WJjJwsGzybVIVB1DPGwQGo64g/viewform",
      "https://docs.google.com/forms/d/e/1FAIpQLScCFMTKZ1Gl-zpGtr5KvYWReWbaxPtBhw4T4CIefuI6v8nLtw/viewform",

    ];

    // Cryptographically strong random index (0 to 7) on every single load
    const randomBuffer = new Uint32Array(1);
    window.crypto.getRandomValues(randomBuffer);
    const randomIndex = randomBuffer[0] % urls.length;

    window.location.replace(urls[randomIndex]);
  </script>
</head>
