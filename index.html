      "https://docs.google.com/forms/d/e/1FAIpQLSegpjk6JuYeH86aA5a5PjP6aZhnFSr6XpsPE9KDUNBWrN9GDw/viewform?usp=header",

    window.location.replace(urls[randomIndex]);
